<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bento — sampler</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--surface:#fff;--border:rgba(20,22,40,.10);--ink:#14162a;--muted:#5b6072;--accent:#6d5efc;--accent-ink:#fff;--gap:14px;--radius:20px;--ease:cubic-bezier(.22,1,.36,1);--dur:200ms}
body{min-height:100vh;background:#f6f7fb;color:var(--ink);font-family:Inter,system-ui,sans-serif;padding:22px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.tag{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(120px,auto);gap:var(--gap)}
.t-hero{grid-column:span 2;grid-row:span 2}.t-wide{grid-column:span 2}.t-normal{grid-column:span 1}
.tile{border-radius:var(--radius);padding:18px;overflow:hidden;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.cta{background:var(--accent);color:var(--accent-ink);border-color:transparent}.cta h2{font-size:1.4rem;line-height:1.15;font-weight:700}.cta .eb{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85}.cta .lk{font-weight:600;opacity:.9}
.stat .l{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.stat .v{font-size:1.9rem;font-weight:800;line-height:1}.stat .d{font-size:.8rem;font-weight:600;color:#15935e}
.feat{flex-direction:row;align-items:center;gap:14px;justify-content:flex-start}.ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;background:color-mix(in oklab,var(--accent) 14%,transparent)}.feat h3{font-size:1rem;font-weight:700}.feat p{font-size:.85rem;color:var(--muted)}
.chart .l{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.spark{display:flex;align-items:flex-end;gap:5px;height:56px}.spark i{flex:1;background:var(--accent);border-radius:5px 5px 0 0;opacity:.85}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}.t-hero{grid-column:span 2}}
</style></head><body>
<div class="wrap">
 <span class="tag">Bento Grid</span>
 <section class="grid">
  <a class="tile t-hero cta" href="#"><div><span class="eb">This month</span><h2>You're on track to hit every goal 🎯</h2></div><span class="lk">View report →</span></a>
  <div class="tile t-normal stat"><span class="l">Revenue</span><span class="v">$48.2k</span><span class="d">▲ 12%</span></div>
  <div class="tile t-normal stat"><span class="l">Users</span><span class="v">3,910</span><span class="d">▲ 6%</span></div>
  <div class="tile t-wide feat"><div class="ic">⚡</div><div><h3>Instant sync</h3><p>Changes land on every device in under a second.</p></div></div>
  <div class="tile t-wide chart"><span class="l">Weekly activity</span><div class="spark"><i style="height:40%"></i><i style="height:70%"></i><i style="height:55%"></i><i style="height:90%"></i><i style="height:65%"></i><i style="height:80%"></i><i style="height:100%"></i></div></div>
 </section>
</div></body></html>
