<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brutalism — sampler</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fff;--ink:#000;--accent:#ff0066;--border:3px solid #000;--sh:6px 6px 0 #000;--sh-sm:4px 4px 0 #000;--ease:cubic-bezier(.2,0,0,1);--dur:120ms}
body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,system-ui,sans-serif;padding:22px}
.brut{border:var(--border);border-radius:0;box-shadow:var(--sh);background:var(--bg)}
.press{transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}.press:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 #000}.press:active{transform:translate(3px,3px);box-shadow:3px 3px 0 #000}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.tag{align-self:flex-start;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:900}
.nav{background:var(--bg);padding:14px 18px;border:0 0 3px 0;border-bottom:3px solid var(--ink);display:flex;align-items:center;gap:16px}
.nav b{margin-right:auto;font-weight:900;font-size:1.2rem;text-transform:uppercase}.nav a{padding:8px 12px;text-decoration:none;font-weight:800;text-transform:uppercase;font-size:.86rem;color:var(--ink);border:3px solid transparent}.nav a.active{background:var(--accent);border-color:var(--ink)}
.card{padding:24px;display:flex;flex-direction:column;gap:10px}.card h3{font-weight:900;text-transform:uppercase;font-size:1.2rem}.card p{font-weight:500;line-height:1.5}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{min-height:48px;padding:0 28px;cursor:pointer;background:var(--bg);color:var(--ink);font-weight:900;letter-spacing:.05em;text-transform:uppercase;box-shadow:var(--sh-sm)}
.btn-accent{background:var(--accent)}
.input{background:var(--bg);min-height:48px;padding:0 16px;font-size:1rem;font-weight:500;color:var(--ink);flex:1;min-width:180px}
.badge{display:inline-block;border:var(--border);padding:2px 10px;background:var(--accent);font-weight:900;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;box-shadow:3px 3px 0 #000}
.stat{padding:22px;display:flex;flex-direction:column;gap:4px}.stat .l{font-weight:900;font-size:.76rem;text-transform:uppercase;letter-spacing:.08em}.stat .v{font-weight:900;font-size:2.8rem;line-height:.95}.stat .s{font-weight:700;color:var(--accent)}
</style></head><body>
<div class="wrap">
 <span class="tag">Brutalism</span>
 <header class="nav"><b>STUDIO™</b><a class="active" href="#">WORK</a><a href="#">ABOUT</a><a href="#">CONTACT</a></header>
 <article class="brut press card"><h3>Raw & sharp</h3><p>Zero radius, offset shadow no blur, one bright accent used like a weapon.</p>
  <div class="row"><button class="brut press btn btn-accent">SUBMIT</button><button class="brut press btn">CANCEL</button><span class="badge">SALE</span></div></article>
 <div class="row"><input class="brut input" placeholder="TYPE HERE"></div>
 <div class="brut stat"><span class="l">USERS</span><span class="v">12,904</span><span class="s">+ 22% MTD</span></div>
</div></body></html>
