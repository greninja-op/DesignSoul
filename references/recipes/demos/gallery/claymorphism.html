<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Claymorphism — sampler</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#eef1fb;--surf:#fff;--accent:#6c63ff;--accent-dk:#5a4bd2;--pink:#ff6584;--green:#52d9a4;--yellow:#ffd166;--text:#2d3748;--muted:#718096;--radius:26px;--spring:cubic-bezier(.34,1.56,.64,1);--dur:200ms;
 --depth:0 8px 0 rgba(0,0,0,.10),0 16px 32px rgba(45,55,72,.12);--emboss:inset 0 -4px 0 rgba(0,0,0,.06),inset 0 4px 8px rgba(255,255,255,.85)}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;padding:22px}
.clay{background:var(--surf);border:none;border-radius:var(--radius);box-shadow:var(--depth),var(--emboss)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.tag{align-self:flex-start;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.nav{display:flex;align-items:center;gap:16px;padding:12px 16px;border-radius:20px}
.nav b{margin-right:auto;font-weight:800}.nav a{color:var(--muted);text-decoration:none;font-weight:600;padding:8px 12px;border-radius:12px}.nav a.active{color:var(--accent);box-shadow:inset 3px 3px 6px rgba(163,177,198,.5),inset -3px -3px 6px rgba(255,255,255,.9)}
.card{padding:26px;display:flex;flex-direction:column;gap:10px}.card h3{font-weight:700}.card p{color:var(--muted);line-height:1.5}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.icons{display:flex;gap:14px}
.ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:1.5rem}
.btn{border:none;cursor:pointer;font-weight:700;min-height:48px;padding:0 26px;border-radius:16px;color:#fff;background:var(--accent);box-shadow:0 6px 0 var(--accent-dk),0 12px 22px rgba(108,99,255,.32),inset 0 -3px 0 rgba(0,0,0,.1),inset 0 3px 6px rgba(255,255,255,.3);transition:transform var(--dur) var(--spring)}
.btn:active{transform:translateY(4px)}
.btn-soft{background:var(--surf);color:var(--text);box-shadow:var(--depth),var(--emboss)}
.input{min-height:50px;padding:0 18px;border:none;border-radius:16px;font-size:1rem;color:var(--text);background:var(--bg);box-shadow:inset 4px 4px 8px rgba(163,177,198,.55),inset -4px -4px 8px rgba(255,255,255,.9);flex:1;min-width:180px}
.switch{width:60px;height:34px;padding:4px;border:none;cursor:pointer;border-radius:999px;background:var(--bg);display:flex;box-shadow:inset 3px 3px 6px rgba(163,177,198,.55),inset -3px -3px 6px rgba(255,255,255,.9)}
.switch .k{width:26px;height:26px;border-radius:50%;background:var(--surf);box-shadow:2px 2px 4px rgba(163,177,198,.7);transition:transform var(--dur) var(--spring)}
.switch[aria-checked=true]{background:var(--accent)}.switch[aria-checked=true] .k{transform:translateX(26px)}
.stat{padding:22px 24px;display:flex;flex-direction:column;gap:6px}.stat .l{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.stat .v{font-size:2.4rem;font-weight:800;line-height:1}
</style></head><body>
<div class="wrap">
 <span class="tag">Claymorphism</span>
 <header class="clay nav"><b>Clay</b><a class="active" href="#">Home</a><a href="#">Explore</a><a href="#">Saved</a></header>
 <article class="clay card"><h3>Soft, inflated card</h3><p>Outer offset depth plus an inner top highlight makes it look puffed.</p>
  <div class="icons"><div class="ic" style="background:var(--pink);box-shadow:0 5px 0 rgba(0,0,0,.1),0 9px 16px rgba(255,101,132,.34),inset 0 2px 4px rgba(255,255,255,.42)">🎨</div><div class="ic" style="background:var(--green);box-shadow:0 5px 0 rgba(0,0,0,.1),0 9px 16px rgba(82,217,164,.34),inset 0 2px 4px rgba(255,255,255,.42)">🌱</div><div class="ic" style="background:var(--yellow);box-shadow:0 5px 0 rgba(0,0,0,.1),0 9px 16px rgba(255,209,102,.4),inset 0 2px 4px rgba(255,255,255,.42)">⭐</div></div>
  <div class="row"><button class="btn">Get started</button><button class="btn btn-soft">Maybe later</button></div></article>
 <div class="row"><input class="input" placeholder="you@studio.com"><button class="switch" role="switch" aria-checked="true" aria-label="Toggle"><span class="k"></span></button></div>
 <div class="clay stat"><span class="l">Streak</span><span class="v">28 days</span></div>
</div></body></html>
