<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cyberpunk / Mech-HUD — sampler</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#05080f;--panel:rgba(10,20,32,.72);--line:rgba(0,229,255,.55);--soft:rgba(0,229,255,.18);--accent:#00e5ff;--accent2:#ff3d81;--warn:#ffcf3a;--text:#cdeef5;--dim:#6f8a95;--glow:0 0 8px rgba(0,229,255,.6);--mono:'Share Tech Mono',ui-monospace,monospace}
body{min-height:100vh;color:var(--text);font-family:Inter,system-ui,sans-serif;padding:22px;background-color:var(--bg);background-image:linear-gradient(var(--soft) 1px,transparent 1px),linear-gradient(90deg,var(--soft) 1px,transparent 1px);background-size:32px 32px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.label{font-family:var(--mono);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.readout{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--accent);text-shadow:var(--glow)}
.nav{display:flex;align-items:center;gap:20px;padding:10px 16px;background:var(--panel);border:1px solid var(--soft);border-top:2px solid var(--accent)}
.nav .brand{margin-right:auto;color:var(--accent);font-family:var(--mono);letter-spacing:.14em}
.links{display:flex;gap:4px}.links a{font-family:var(--mono);font-size:.78rem;letter-spacing:.1em;padding:8px 12px;text-decoration:none;color:var(--dim);border:1px solid transparent}.links a.active{color:var(--accent);border-color:var(--line);box-shadow:inset 0 0 8px rgba(0,229,255,.2)}
.status{font-family:var(--mono);font-size:.72rem;color:var(--dim);display:inline-flex;align-items:center;gap:6px}.status i{width:8px;height:8px;border-radius:50%;background:#39ff8a;box-shadow:0 0 8px #39ff8a}
.panel{position:relative;background:var(--panel);border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:10px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
.panel h3{font-weight:700}.panel p{color:var(--dim);line-height:1.5}
.panel::before,.panel::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--accent);filter:drop-shadow(var(--glow))}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0}.panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.big{font-size:2.6rem;line-height:1}.big .u{font-size:1rem;margin-left:4px}
.gauge{height:8px;background:rgba(0,229,255,.1);border:1px solid var(--soft);overflow:hidden}.gauge i{display:block;height:100%;width:87%;background:var(--accent);box-shadow:var(--glow)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{background:transparent;color:var(--accent);cursor:pointer;border:1px solid var(--line);min-height:44px;padding:0 22px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.12em;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);transition:background 120ms,box-shadow 120ms}
.btn:hover{background:rgba(0,229,255,.12);box-shadow:var(--glow),inset 0 0 12px rgba(0,229,255,.2)}
.btn2{color:var(--accent2);border-color:rgba(255,61,129,.55)}.btn2:hover{background:rgba(255,61,129,.12);box-shadow:0 0 8px rgba(255,61,129,.6)}
.input{background:rgba(0,0,0,.4);color:var(--text);font-family:var(--mono);border:1px solid var(--soft);border-left:2px solid var(--accent);min-height:44px;padding:0 12px;flex:1;min-width:180px;caret-color:var(--accent)}
.input::placeholder{color:var(--dim)}
.switch{width:58px;height:28px;padding:2px;cursor:pointer;background:rgba(0,0,0,.5);border:1px solid var(--accent);display:flex;box-shadow:inset 0 0 10px rgba(0,229,255,.25)}.switch .k{width:24px;height:22px;background:var(--accent);transform:translateX(30px);box-shadow:var(--glow)}
</style></head><body>
<div class="wrap">
 <span class="label">Cyberpunk / Mech-HUD</span>
 <header class="nav"><span class="brand">◤ NEXUS-OS</span><nav class="links"><a class="active" href="#">DASH</a><a href="#">MAP</a><a href="#">LOGS</a></nav><span class="status"><i></i> ONLINE</span></header>
 <section class="panel"><span class="label">SYS · CORE</span><h3>Reactor status</h3><p>Angular machined panel with glowing corner ticks and a notched corner.</p>
  <div class="row"><button class="btn">ENGAGE</button><button class="btn btn2">ABORT</button></div></section>
 <section class="panel"><span class="label">HULL INTEGRITY</span><div class="readout big">87<span class="u">%</span></div><div class="gauge"><i></i></div></section>
 <div class="row"><input class="input" placeholder="ENTER ID"><button class="switch" role="switch" aria-checked="true" aria-label="Toggle"><span class="k"></span></button></div>
</div></body></html>
