<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cyber-Retro / Windows Desktop — sampler</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--face:#c0c0c0;--face2:#d9d9d9;--hi:#fff;--lo:#808080;--lo2:#404040;--title1:#1a52c9;--title2:#4b9bff;--desktop:#128a86;--ink:#0a0a0a;--ui:'Tahoma','Segoe UI',system-ui,sans-serif;--pixel:'VT323',monospace}
body{min-height:100vh;background:var(--desktop);color:var(--ink);font-family:var(--ui);padding:22px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.tag{font-family:var(--pixel);font-size:1.4rem;color:#fff;letter-spacing:.02em}
.win{background:var(--face);border:2px solid;border-color:var(--hi) var(--lo2) var(--lo2) var(--hi);box-shadow:inset 1px 1px 0 var(--face2),inset -1px -1px 0 var(--lo)}
.title{display:flex;align-items:center;gap:8px;padding:4px 6px;background:linear-gradient(90deg,var(--title1),var(--title2));color:#fff;font-weight:700}
.controls{margin-left:auto;display:flex;gap:3px}
.body{padding:14px;line-height:1.5;display:flex;flex-direction:column;gap:12px}
.btn{font-family:var(--ui);font-size:.9rem;color:var(--ink);cursor:pointer;background:var(--face);padding:7px 18px;border-radius:0;border:2px solid;border-color:var(--hi) var(--lo2) var(--lo2) var(--hi);box-shadow:inset 1px 1px 0 var(--face2),inset -1px -1px 0 var(--lo)}
.btn:active{border-color:var(--lo2) var(--hi) var(--hi) var(--lo2);box-shadow:inset 1px 1px 0 var(--lo)}
.btn.sq{width:22px;height:20px;padding:0;display:grid;place-items:center;font-size:.7rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;align-items:center;gap:8px}
.input{font-family:var(--ui);color:var(--ink);background:#fff;border-radius:0;padding:6px 8px;flex:1;border:2px solid;border-color:var(--lo2) var(--hi) var(--hi) var(--lo2)}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer}.check input{position:absolute;opacity:0}.check .box{width:16px;height:16px;background:#fff;border:2px solid;border-color:var(--lo2) var(--hi) var(--hi) var(--lo2);display:grid;place-items:center;font-weight:800}.check input:checked + .box::after{content:"✓"}
.progress{height:22px;padding:2px;background:#fff;border:2px solid;border-color:var(--lo2) var(--hi) var(--hi) var(--lo2)}.progress i{display:block;height:100%;width:64%;background-color:var(--title1);background-image:repeating-linear-gradient(90deg,var(--title1) 0 12px,transparent 12px 16px)}
.taskbar{display:flex;align-items:center;gap:6px;padding:5px 6px;background:var(--face);border-top:2px solid var(--hi);border-left:2px solid var(--hi)}
.tray{margin-left:auto;padding:5px 10px;font-variant-numeric:tabular-nums;background:var(--face);border:2px solid;border-color:var(--lo2) var(--hi) var(--hi) var(--lo2)}
</style></head><body>
<div class="wrap">
 <span class="tag">CYBER-RETRO / WINDOWS DESKTOP</span>
 <div class="win">
  <div class="title"><span>◆ readme.txt — Notepad</span><span class="controls"><button class="btn sq">_</button><button class="btn sq">□</button><button class="btn sq">✕</button></span></div>
  <div class="body"><p>A real window: raised frame, gradient title bar, beveled controls. Buttons push in on click.</p>
   <div class="field"><span>File name:</span><input class="input" value="untitled.doc"></div>
   <label class="check"><input type="checkbox" checked><span class="box"></span> Show hidden files</label>
   <div class="progress"><i></i></div>
   <div class="row"><button class="btn">OK</button><button class="btn">Cancel</button></div>
  </div>
 </div>
 <div class="taskbar"><button class="btn" style="font-weight:800">▦ Start</button><button class="btn" style="flex:0 1 160px;text-align:left">My Computer</button><span class="tray">12:00 PM</span></div>
</div></body></html>
