<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doodle / Sketch — sampler</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--paper:#fbf7ee;--kraft:#e7d9bd;--ink:#2b2b2b;--accent:#ef6f52;--shadow:3px 4px 0 rgba(43,43,43,.18);--wobble:255px 15px 225px 15px / 15px 225px 15px 255px;--hand:'Caveat',cursive;--body:'Comic Neue',system-ui,sans-serif}
body{min-height:100vh;background-color:var(--paper);color:var(--ink);font-family:var(--body);padding:22px;background-image:linear-gradient(var(--kraft) 1px,transparent 1px);background-size:100% 28px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.tag{align-self:flex-start;font-family:var(--hand);font-size:1.6rem}
.nav{display:flex;align-items:center;gap:16px;padding:12px 18px;background:var(--paper);border:2.5px solid var(--ink);border-radius:var(--wobble);box-shadow:var(--shadow)}
.nav .brand{font-family:var(--hand);font-size:1.6rem;margin-right:auto;text-decoration:none;color:var(--ink)}
.links{display:flex;gap:8px}.links a{font-family:var(--hand);font-size:1.3rem;text-decoration:none;color:var(--ink);padding:2px 8px}.links a.active{color:var(--accent);text-decoration:underline;text-decoration-style:wavy}
.card{background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);border-radius:var(--wobble);box-shadow:var(--shadow);padding:22px;transform:rotate(-.6deg);display:flex;flex-direction:column;gap:10px}
.card h3{font-family:var(--hand);font-size:2rem;line-height:1.05}.card p{line-height:1.55}
.underline{position:relative}.underline::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:6px;background:var(--accent);opacity:.5;border-radius:40% 60% 50% 45%}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.btn{background:var(--accent);color:#fff;cursor:pointer;border:2.5px solid var(--ink);border-radius:225px 15px 255px 15px / 15px 255px 15px 225px;box-shadow:var(--shadow);min-height:48px;padding:0 24px;font-family:var(--hand);font-size:1.3rem;transition:transform 120ms}
.btn:hover{transform:rotate(-1deg) translateY(-2px)}.btn:active{transform:rotate(0) translateY(1px)}
.btn-ghost{background:transparent;color:var(--ink)}
.input{background:transparent;color:var(--ink);font-family:var(--body);font-size:1rem;border:none;border-bottom:2.5px dashed var(--ink);padding:8px 4px;flex:1;min-width:160px}
.input:focus{outline:none;border-bottom-style:solid}
.check{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:1.05rem}.check input{position:absolute;opacity:0}.check .box{width:26px;height:26px;border:2.5px solid var(--ink);border-radius:60% 40% 55% 45% / 45% 55% 45% 55%;display:grid;place-items:center}.check input:checked + .box::after{content:"✓";font-family:var(--hand);font-size:1.4rem;color:var(--accent)}
.sticky{background:#fff3a8;color:var(--ink);font-family:var(--hand);font-size:1.25rem;line-height:1.2;padding:16px;width:150px;transform:rotate(2deg);box-shadow:var(--shadow);border-radius:2px}
</style></head><body>
<div class="wrap">
 <span class="tag">Doodle / Sketch</span>
 <header class="nav"><a class="brand" href="#">✐ Sketchbook</a><nav class="links"><a class="active" href="#">Notes</a><a href="#">Boards</a><a href="#">Bin</a></nav></header>
 <article class="card"><h3>My little <span class="underline">note</span></h3><p>Wobbly borders, ruled paper, a soft inked shadow, and a tiny tilt so it feels drawn by hand.</p>
  <div class="row"><button class="btn">Let's go! ✎</button><button class="btn btn-ghost">Nah</button></div>
  <label class="check"><input type="checkbox" checked><span class="box"></span> Buy more sticky notes</label></article>
 <div class="row"><input class="input" placeholder="scribble here…"><div class="sticky">Water the<br>plants 🪴</div></div>
</div></body></html>
