<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glassmorphism — sampler</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--glass-blur:10px;--glass-bg:rgba(255,255,255,.10);--glass-bg-strong:rgba(255,255,255,.18);--glass-border:rgba(255,255,255,.30);--glass-hl:rgba(255,255,255,.55);--glass-radius:18px;--accent:#6d5efc;--ease:cubic-bezier(.22,1,.36,1);--dur:180ms}
body{min-height:100vh;font-family:Inter,system-ui,sans-serif;color:#0e1020;padding:22px;
 background-color:hsl(248,65%,95%);
 background-image:radial-gradient(at 14% 12%,hsla(250,100%,64%,.88)0,transparent 55%),radial-gradient(at 88% 8%,hsla(292,100%,66%,.82)0,transparent 52%),radial-gradient(at 80% 82%,hsla(189,100%,54%,.80)0,transparent 55%),radial-gradient(at 14% 90%,hsla(332,100%,64%,.80)0,transparent 52%)}
.glass{background:var(--glass-bg);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(135%);backdrop-filter:blur(var(--glass-blur)) saturate(135%);border:1px solid var(--glass-border);border-radius:var(--glass-radius);box-shadow:0 8px 32px rgba(16,18,40,.18),inset 0 1px 0 var(--glass-hl);color:#0e1020}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.tag{align-self:flex-start;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.8}
.nav{display:flex;align-items:center;gap:16px;padding:10px 16px}
.nav b{margin-right:auto}.nav a{color:#0e1020;text-decoration:none;opacity:.8;font-size:.9rem}.nav a.active{opacity:1;font-weight:600}
.card{padding:22px;display:flex;flex-direction:column;gap:10px}.card h3{font-size:1.2rem}.card p{color:#3a3d52;line-height:1.5}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{height:44px;padding:0 20px;border-radius:12px;font-weight:600;border:1px solid transparent;cursor:pointer;transition:transform var(--dur) var(--ease)}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 20px color-mix(in oklab,var(--accent) 45%,transparent)}
.btn-glass{background:var(--glass-bg-strong);color:#0e1020;border-color:var(--glass-border);-webkit-backdrop-filter:blur(var(--glass-blur));backdrop-filter:blur(var(--glass-blur))}
.input{height:46px;padding:0 14px;border-radius:12px;background:var(--glass-bg-strong);border:1px solid var(--glass-border);-webkit-backdrop-filter:blur(var(--glass-blur));backdrop-filter:blur(var(--glass-blur));color:#0e1020;font-size:1rem;flex:1;min-width:180px}
.input::placeholder{color:rgba(14,16,32,.5)}
.switch{width:46px;height:28px;padding:3px;border-radius:999px;background:var(--glass-bg-strong);border:1px solid var(--glass-border);display:flex;cursor:pointer}
.switch .k{width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform var(--dur) var(--ease)}
.switch[aria-checked=true]{background:var(--accent);border-color:transparent}.switch[aria-checked=true] .k{transform:translateX(18px)}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 12px;border-radius:999px;font-size:.78rem;font-weight:500;background:var(--glass-bg-strong);border:1px solid var(--glass-border)}
.stat{padding:18px 20px;display:flex;flex-direction:column;gap:6px}.stat .l{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:#3a3d52}.stat .v{font-size:2.2rem;font-weight:700;line-height:1}
</style></head><body>
<div class="wrap">
 <span class="tag">Glassmorphism</span>
 <header class="glass nav"><b>Campus</b><a class="active" href="#">Dashboard</a><a href="#">Results</a><a href="#">Profile</a></header>
 <article class="glass card"><h3>Frosted glass card</h3><p>See-through, low fill alpha, light edge + inner top highlight over a rich background.</p>
  <div class="row"><button class="btn btn-primary">Primary</button><button class="btn btn-glass">Secondary</button></div></article>
 <div class="row">
  <input class="input" placeholder="you@college.edu">
  <button class="switch" role="switch" aria-checked="true" aria-label="Toggle"><span class="k"></span></button>
  <span class="glass chip">On track</span>
 </div>
 <div class="glass stat"><span class="l">Attendance</span><span class="v">94%</span></div>
</div></body></html>
