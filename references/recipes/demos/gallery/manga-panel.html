<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manga Panel Grid — sampler</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#111;--paper:#f7f5ef;--accent:#e5322d;--border:3px solid #111;--tone:rgba(17,17,17,.9);--display:'Bangers',Impact,system-ui,sans-serif;--body:'Inter',system-ui,sans-serif}
body{min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--body);padding:22px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.tag{align-self:flex-start;font-family:var(--display);font-size:1.2rem;letter-spacing:.04em;background:var(--ink);color:#fff;padding:2px 12px;transform:skewX(-6deg)}
.nav{display:flex;align-items:center;gap:16px;padding:12px 18px;background:var(--paper);border:var(--border);box-shadow:5px 5px 0 var(--ink)}
.nav .brand{font-family:var(--display);font-size:1.4rem;margin-right:auto;text-decoration:none;color:var(--ink)}
.links{display:flex;gap:6px}.links a{font-weight:700;text-decoration:none;color:var(--ink);padding:8px 12px;border:2px solid transparent}.links a.active{background:var(--ink);color:#fff}
.panel{background:var(--paper);border:var(--border);padding:22px;transform:skewX(-3deg);box-shadow:6px 6px 0 var(--ink)}
.inner{transform:skewX(3deg);display:flex;flex-direction:column;gap:10px}
.panel h3{font-family:var(--display);font-size:1.6rem}.panel p{font-weight:500;line-height:1.5}
.focal{position:relative;display:grid;place-items:center;padding:34px;border:var(--border);overflow:hidden}
.burst{position:absolute;inset:-20%;background:var(--paper);background-image:repeating-conic-gradient(from 0deg at 50% 50%,var(--ink) 0 1.5deg,transparent 1.5deg 5deg)}
.title{position:relative;font-family:var(--display);font-size:clamp(2.2rem,6vw,4rem);text-transform:uppercase;-webkit-text-stroke:1.5px var(--ink);color:#fff}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.btn{position:relative;background:var(--ink);color:#fff;border:var(--border);font-family:var(--display);font-size:1.1rem;cursor:pointer;padding:12px 26px;transform:skewX(-8deg);overflow:hidden}
.btn>span{display:inline-block;transform:skewX(8deg)}.btn:hover{background:var(--accent)}
.btn::before{content:"";position:absolute;inset:-50%;opacity:0;background:repeating-conic-gradient(from 0deg,transparent 0 6deg,rgba(255,255,255,.25) 6deg 8deg);transition:opacity 120ms}.btn:hover::before{opacity:1}
.btn-ghost{background:#fff;color:var(--ink)}
.input{background:#fff;border:var(--border);border-radius:20px 20px 20px 4px;min-height:46px;padding:0 16px;font-weight:600;color:var(--ink);flex:1;min-width:180px}
.input:focus{outline:none;border-width:5px}
</style></head><body>
<div class="wrap">
 <span class="tag">MANGA PANEL GRID</span>
 <header class="nav"><a class="brand" href="#">INK &amp; TONE</a><nav class="links"><a class="active" href="#">Read</a><a href="#">Series</a><a href="#">About</a></nav></header>
 <section class="panel"><div class="inner"><h3>CHAPTER ONE</h3><p>Slanted inked panel with a hard shadow. Contents are un-skewed so the text stays straight and readable.</p>
  <div class="row"><button class="btn"><span>NEXT ▶</span></button><button class="btn btn-ghost"><span>BACK</span></button></div></div></section>
 <div class="focal"><div class="burst"></div><h2 class="title">BOOM!</h2></div>
 <div class="row"><input class="input" placeholder="Say something dramatic…"></div>
</div></body></html>
