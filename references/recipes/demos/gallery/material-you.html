<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Material You — sampler</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--h:255;--primary:hsl(var(--h) 55% 52%);--on-primary:#fff;--pc:hsl(var(--h) 70% 92%);--opc:hsl(var(--h) 60% 22%);--surface:hsl(var(--h) 25% 99%);--s1:hsl(var(--h) 24% 97%);--s2:hsl(var(--h) 22% 95%);--s3:hsl(var(--h) 20% 93%);--sv:hsl(var(--h) 18% 90%);--on:hsl(var(--h) 15% 13%);--onv:hsl(var(--h) 10% 40%);--outline:hsl(var(--h) 10% 60%);--full:9999px;--emph:cubic-bezier(.2,0,0,1);--spring:cubic-bezier(.34,1.56,.64,1);--dur:200ms}
body{min-height:100vh;background:var(--surface);color:var(--on);font-family:Roboto,Inter,system-ui,sans-serif;padding:22px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.tag{align-self:flex-start;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--onv)}
.btn{position:relative;overflow:hidden;border:none;cursor:pointer;height:40px;padding:0 24px;border-radius:var(--full);font-weight:500;font-size:.95rem}
.btn::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity var(--dur) var(--emph)}.btn:hover::after{opacity:.08}.btn:active::after{opacity:.12}
.filled{background:var(--primary);color:var(--on-primary)}.tonal{background:var(--pc);color:var(--opc)}.outlined{background:transparent;color:var(--primary);border:1px solid var(--outline)}
.card{background:var(--s1);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.1);display:flex;flex-direction:column;gap:8px}
.card.elev{background:var(--s3);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.card h3{font-weight:500}.card p{color:var(--onv);line-height:1.5}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.field{position:relative;flex:1;min-width:200px}.field input{width:100%;height:56px;padding:22px 16px 8px;border:none;background:var(--sv);color:var(--on);border-radius:8px 8px 0 0;border-bottom:1px solid var(--outline);font-size:1rem}.field input:focus{outline:none;border-bottom:2px solid var(--primary)}
.field span{position:absolute;left:16px;top:18px;color:var(--onv);pointer-events:none;transition:transform var(--dur) var(--emph),color var(--dur)}.field input:focus+span,.field input:not(:placeholder-shown)+span{transform:translateY(-12px) scale(.75);color:var(--primary)}
.sw{width:52px;height:32px;border:2px solid var(--outline);cursor:pointer;border-radius:var(--full);background:var(--sv);position:relative;transition:background var(--dur),border-color var(--dur)}
.sw .t{position:absolute;top:50%;left:6px;width:16px;height:16px;border-radius:50%;background:var(--outline);transform:translateY(-50%);transition:all var(--dur) var(--spring)}
.sw[aria-checked=true]{background:var(--primary);border-color:var(--primary)}.sw[aria-checked=true] .t{width:24px;height:24px;left:auto;right:2px;background:var(--on-primary)}
.chip{height:32px;padding:0 16px;border-radius:8px;border:1px solid var(--outline);background:var(--pc);color:var(--opc);font-size:.86rem;font-weight:500;display:inline-flex;align-items:center}
.fab{width:56px;height:56px;border:none;cursor:pointer;border-radius:24px;background:var(--pc);color:var(--opc);box-shadow:0 4px 10px rgba(0,0,0,.18);display:grid;place-items:center;font-size:1.4rem;transition:transform var(--dur) var(--spring)}.fab:active{transform:scale(.96)}
</style></head><body>
<div class="wrap">
 <span class="tag">Material You (M3)</span>
 <article class="card elev"><h3>Tonal elevation</h3><p>All roles derive from one seed hue; higher surface = lighter tone; hover/press are state layers.</p>
  <div class="row"><button class="btn filled">Save</button><button class="btn tonal">Share</button><button class="btn outlined">Cancel</button></div></article>
 <label class="field"><input type="text" placeholder=" " id="n"><span>Full name</span></label>
 <div class="row"><button class="sw" role="switch" aria-checked="true" aria-label="Toggle"><span class="t"></span></button><span class="chip">✓ Filter</span><button class="fab" aria-label="Compose">✎</button></div>
</div></body></html>
