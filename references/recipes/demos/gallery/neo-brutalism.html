<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neo-Brutalism — sampler</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fffef2;--ink:#111;--border:2px solid #111;--sh:4px 4px 0 #111;--sh-lg:6px 6px 0 #111;--radius:6px;--yellow:#ffd23f;--pink:#ff5da2;--blue:#4d9de0;--green:#6bcb77;--purple:#9b5de5;--ease:cubic-bezier(.2,0,0,1);--dur:120ms}
body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',Inter,system-ui,sans-serif;padding:22px}
.nb{border:var(--border);border-radius:var(--radius);box-shadow:var(--sh)}
.press{transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}.press:hover{transform:translate(-2px,-2px);box-shadow:var(--sh-lg)}.press:active{transform:translate(4px,4px);box-shadow:0 0 0 #111}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.tag{align-self:flex-start;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.nav{background:var(--bg);padding:12px 16px;display:flex;align-items:center;gap:12px}
.nav b{margin-right:auto;font-weight:800;font-size:1.15rem}.nav a{padding:8px 12px;border-radius:5px;text-decoration:none;font-weight:700;color:var(--ink);border:2px solid transparent}.nav a.active{background:var(--yellow);border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.card{padding:24px;display:flex;flex-direction:column;gap:10px;color:var(--ink)}.card h3{font-weight:800;font-size:1.25rem}.card p{font-weight:500;line-height:1.5}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{min-height:46px;padding:0 24px;font-weight:800;color:var(--ink);cursor:pointer}
.input{background:#fff;min-height:46px;padding:0 16px;font-size:1rem;font-weight:500;color:var(--ink);box-shadow:inset 2px 2px 0 rgba(0,0,0,.06);flex:1;min-width:180px}
.badge{display:inline-block;padding:3px 10px;border-radius:4px;box-shadow:2px 2px 0 var(--ink);font-weight:800;font-size:.72rem;text-transform:uppercase}
.switch{width:62px;height:34px;padding:3px;cursor:pointer;border:var(--border);border-radius:6px;background:#fff;display:flex;box-shadow:var(--sh)}
.switch .k{width:26px;height:26px;border:var(--border);border-radius:4px;background:#fff;transition:transform var(--dur) var(--ease)}
.switch[aria-checked=true]{background:var(--green)}.switch[aria-checked=true] .k{transform:translateX(28px)}
.stat{padding:20px 22px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}.stat .l{font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.stat .v{font-size:2.4rem;font-weight:800;line-height:1}
</style></head><body>
<div class="wrap">
 <span class="tag">Neo-Brutalism</span>
 <header class="nb nav"><b>BRUTAL</b><a class="active" href="#">Home</a><a href="#">Work</a><a href="#">Shop</a></header>
 <article class="nb press card" style="background:var(--pink)"><h3>Flat fill, hard shadow</h3><p>Thick border, zero-blur offset shadow, small radius. Clunks down on click.</p>
  <div class="row"><button class="nb press btn" style="background:var(--yellow)">Get started</button><button class="nb press btn" style="background:#fff">Secondary</button><span class="nb badge" style="background:var(--green)">NEW</span></div></article>
 <div class="row"><input class="nb input" placeholder="you@site.com"><button class="switch" role="switch" aria-checked="true" aria-label="Toggle"><span class="k"></span></button></div>
 <div class="nb stat" style="background:var(--blue)"><span class="l">Signups</span><span class="v">1,204</span></div>
</div></body></html>
