<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neumorphism — sampler</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#e0e5ec;--light:rgba(255,255,255,.85);--dark:rgba(163,177,198,.6);--text:#3d4759;--muted:#6b7688;--accent:#6c63ff;--radius:18px;--ease:cubic-bezier(.22,1,.36,1);--dur:180ms;
 --raised:6px 6px 12px var(--dark),-6px -6px 12px var(--light);--inset:inset 5px 5px 10px var(--dark),inset -5px -5px 10px var(--light)}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;padding:22px}
.neu{background:var(--bg);border:none;border-radius:var(--radius);box-shadow:var(--raised)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.tag{align-self:flex-start;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.nav{display:flex;align-items:center;gap:14px;padding:12px 16px}
.nav b{margin-right:auto;font-weight:800}.nav a{color:var(--muted);text-decoration:none;font-weight:600;padding:9px 14px;border-radius:12px}.nav a.active{color:var(--accent);box-shadow:var(--inset)}
.card{padding:24px;display:flex;flex-direction:column;gap:12px}.card h3{font-weight:700}.card p{color:var(--muted);line-height:1.5}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.btn{background:var(--bg);border:none;cursor:pointer;min-height:48px;padding:0 26px;border-radius:14px;font-weight:600;color:var(--text);box-shadow:var(--raised);transition:box-shadow var(--dur) var(--ease)}
.btn:active{box-shadow:var(--inset);color:var(--accent)}
.input{min-height:50px;padding:0 18px;border:none;border-radius:14px;font-size:1rem;color:var(--text);background:var(--bg);box-shadow:var(--inset);flex:1;min-width:180px}
.switch{width:62px;height:34px;padding:4px;border:none;cursor:pointer;border-radius:999px;background:var(--bg);display:flex;box-shadow:var(--inset)}
.switch .k{width:26px;height:26px;border-radius:50%;background:var(--bg);box-shadow:3px 3px 6px var(--dark),-3px -3px 6px var(--light);transition:transform var(--dur) var(--ease),background var(--dur)}
.switch[aria-checked=true] .k{transform:translateX(28px);background:var(--accent)}
.stat{padding:22px 24px;display:flex;flex-direction:column;gap:10px}.stat .l{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.stat .v{font-size:2.1rem;font-weight:800;line-height:1}
.bar{height:12px;border-radius:999px;box-shadow:var(--inset);overflow:hidden}.bar i{display:block;height:100%;width:68%;background:var(--accent)}
</style></head><body>
<div class="wrap">
 <span class="tag">Neumorphism</span>
 <header class="neu nav"><b>Soft</b><a class="active" href="#">Home</a><a href="#">Cards</a><a href="#">Settings</a></header>
 <article class="neu card"><h3>Carved from the background</h3><p>One surface color; depth is only light + shadow. No borders anywhere.</p>
  <div class="row"><button class="btn">Continue</button><button class="btn">Save</button></div></article>
 <div class="row"><input class="input" placeholder="Search…"><button class="switch" role="switch" aria-checked="true" aria-label="Toggle"><span class="k"></span></button></div>
 <div class="neu stat"><span class="l">Balance</span><span class="v">$4,820</span><div class="bar"><i></i></div></div>
</div></body></html>
