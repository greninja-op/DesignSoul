<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>8-Bit / Pixel Art — sampler</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;image-rendering:pixelated}
:root{--bg:#0f0f1b;--panel:#26254a;--ink:#e8e6ff;--accent:#ffe14d;--green:#46e86a;--hi:rgba(255,255,255,.85);--lo:rgba(0,0,0,.55);--font:'Press Start 2P',monospace}
body{min-height:100vh;color:var(--ink);font-family:var(--font);padding:24px;background-color:var(--bg);background-image:linear-gradient(rgba(255,255,255,.04) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.04) 2px,transparent 2px);background-size:16px 16px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.tag{font-size:.7rem;color:var(--accent);line-height:1.5}
.nav{display:flex;align-items:center;gap:16px;padding:14px;font-size:.62rem;background:var(--panel);box-shadow:0 0 0 4px #000,inset 4px 4px 0 var(--hi),inset -4px -4px 0 var(--lo)}
.nav .brand{color:var(--accent);margin-right:auto}.links{display:flex;gap:12px}.links a{text-decoration:none;color:var(--ink)}.links a.active{color:var(--accent)}
.card{background:var(--panel);color:var(--ink);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 0 0 4px #000,0 0 0 8px var(--ink),0 0 0 12px #000}
.card h3{font-size:.78rem;color:var(--accent);line-height:1.4}.card p{font-size:.6rem;line-height:1.9}
.menu{list-style:none;font-size:.68rem;line-height:2.4}.menu li{padding-left:26px;position:relative;cursor:pointer}.menu li.active{color:var(--accent)}.menu li.active::before{content:"▶";position:absolute;left:4px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.bar{height:20px;background:#000;padding:4px;box-shadow:0 0 0 4px #000}.bar i{display:block;height:100%;width:70%;background:var(--green);background-image:repeating-linear-gradient(90deg,transparent 0 10px,rgba(0,0,0,.4) 10px 12px)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:4px}
.btn{font-family:var(--font);font-size:.68rem;line-height:1.4;color:#000;background:var(--accent);border:none;cursor:pointer;padding:14px 18px;transition:none;box-shadow:0 0 0 4px #000,inset 4px 4px 0 var(--hi),inset -4px -4px 0 var(--lo)}
.btn:hover{background:#fff}.btn:active{box-shadow:0 0 0 4px #000,inset -4px -4px 0 var(--hi),inset 4px 4px 0 var(--lo)}
.btn-green{background:var(--green)}
.input{font-family:var(--font);font-size:.66rem;color:var(--ink);background:#000;border:none;padding:12px;flex:1;min-width:160px;box-shadow:inset 4px 4px 0 var(--lo),0 0 0 4px #000}
.input::placeholder{color:#5a5a80}
.switch{width:60px;height:28px;padding:4px;cursor:pointer;background:#000;border:none;display:flex;box-shadow:0 0 0 4px #000}.switch .k{width:24px;height:20px;background:var(--green);transform:translateX(28px)}
</style></head><body>
<div class="wrap">
 <span class="tag">8-BIT / PIXEL ART</span>
 <header class="nav"><span class="brand">◆ PIXEL QUEST</span><nav class="links"><a class="active" href="#">MAP</a><a href="#">BAG</a><a href="#">SHOP</a></nav><span style="color:var(--accent)">×08</span></header>
 <section class="card"><h3>PLAYER STATS</h3><p>HP 24/24 · MP 12/12 · LVL 7</p><div class="bar"><i></i></div>
  <ul class="menu"><li class="active">NEW GAME</li><li>CONTINUE</li><li>OPTIONS</li></ul></section>
 <div class="row"><button class="btn">START</button><button class="btn btn-green">SAVE</button></div>
 <div class="row"><input class="input" placeholder="AAA"><button class="switch" role="switch" aria-checked="true" aria-label="Toggle"><span class="k"></span></button></div>
</div></body></html>
