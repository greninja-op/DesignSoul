<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retro / Y2K — sampler</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg1:#2a0a4a;--bg2:#7b2ff7;--pink:#ff5db1;--cyan:#2de2e6;--lime:#b6ff3c;--c1:#f0f0ff;--c2:#9aa7d8;--ink:#1a0533;--text:#f5f0ff;--gp:0 0 16px rgba(255,93,177,.7);--gc:0 0 16px rgba(45,226,230,.7);--dur:200ms;--ease:cubic-bezier(.22,1,.36,1)}
body{min-height:100vh;color:var(--text);font-family:Inter,system-ui,sans-serif;padding:22px;position:relative;overflow:hidden;background:radial-gradient(60% 50% at 50% 0%,var(--pink)0,transparent 55%),linear-gradient(180deg,var(--bg2),var(--bg1))}
body::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40%;pointer-events:none;opacity:.25;background-image:linear-gradient(var(--cyan) 1px,transparent 1px),linear-gradient(90deg,var(--cyan) 1px,transparent 1px);background-size:40px 40px;transform:perspective(300px) rotateX(60deg);transform-origin:bottom}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.tag{align-self:flex-start;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--cyan)}
.nav{display:flex;align-items:center;gap:16px;padding:10px 16px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.nav b{margin-right:auto;font-family:Orbitron,system-ui;font-weight:800;font-size:1.2rem}.nav a{font-size:.85rem;padding:8px 12px;border-radius:8px;text-decoration:none;color:rgba(245,240,255,.8)}.nav a.active{color:var(--ink);background:var(--cyan);box-shadow:var(--gc)}
.holo{font-family:Orbitron,system-ui,sans-serif;font-weight:800;font-size:2.2rem;background:linear-gradient(120deg,var(--pink),var(--cyan),var(--lime),var(--pink));background-size:300% 300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:holo 6s linear infinite}@keyframes holo{to{background-position:300% 0}}
.card{position:relative;overflow:hidden;padding:24px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:10px}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.15) 50%,transparent 70%)}
.card p{color:rgba(245,240,255,.82);line-height:1.5}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:2px solid rgba(255,255,255,.7);border-radius:999px;cursor:pointer;min-height:46px;padding:0 28px;font-weight:700;color:var(--ink);background:linear-gradient(135deg,var(--pink),var(--cyan));box-shadow:var(--gp);transition:transform var(--dur) var(--ease),box-shadow var(--dur)}.btn:hover{transform:translateY(-2px);box-shadow:var(--gc),0 0 32px rgba(45,226,230,.5)}
.input{min-height:46px;padding:0 14px;border:2px solid rgba(45,226,230,.5);border-radius:10px;background:rgba(26,5,51,.5);color:var(--text);font-size:1rem;flex:1;min-width:180px}
.badge{display:inline-block;padding:3px 12px;border-radius:999px;font-family:Orbitron,system-ui;font-size:.72rem;font-weight:700;color:var(--ink);background:var(--pink);box-shadow:var(--gp)}
.switch{width:60px;height:32px;padding:3px;border:2px solid rgba(255,255,255,.5);cursor:pointer;border-radius:999px;background:rgba(26,5,51,.6);display:flex}
.switch .k{width:24px;height:24px;border-radius:50%;background:#fff;transition:transform var(--dur) var(--ease)}
.switch[aria-checked=true]{background:linear-gradient(135deg,var(--pink),var(--cyan));box-shadow:var(--gc)}.switch[aria-checked=true] .k{transform:translateX(28px)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="wrap">
 <span class="tag">Retro / Y2K / Vaporwave</span>
 <header class="nav"><b>Y2K</b><a class="active" href="#">HOME</a><a href="#">MIX</a><a href="#">CREW</a></header>
 <h1 class="holo">HOLOGRAPHIC</h1>
 <article class="card"><p>Glassy panel with a diagonal iridescent sheen, over a saturated cyber-sunset gradient.</p>
  <div class="row"><button class="btn">ENTER</button><span class="badge">LIVE</span><button class="switch" role="switch" aria-checked="true" aria-label="Toggle"><span class="k"></span></button></div></article>
 <div class="row"><input class="input" placeholder="enter_name"></div>
</div></body></html>
