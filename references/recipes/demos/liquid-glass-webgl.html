<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>True Liquid Glass — WebGL (DesignSoul)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0a0b1e;font-family:system-ui,'Segoe UI',sans-serif}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  .hint{position:fixed;left:50%;top:22px;transform:translateX(-50%);z-index:5;color:#fff;
    font-size:.86rem;letter-spacing:.02em;opacity:.85;background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    padding:8px 16px;border-radius:999px;pointer-events:none}
  .panel{position:fixed;right:18px;bottom:18px;z-index:5;width:230px;color:#fff;
    background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-radius:16px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.4)}
  .panel h4{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:10px}
  .panel label{display:block;font-size:.74rem;opacity:.85;margin:10px 0 3px}
  .panel input[type=range]{width:100%;accent-color:#a78bfa}
  .panel .v{float:right;opacity:.7;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="hint">Drag the glass lens — it refracts the live background in real time</div>
<div class="panel">
  <h4>Liquid Glass · WebGL</h4>
  <label>Refraction <span class="v" id="vR">34</span></label><input id="sR" type="range" min="0" max="80" value="34">
  <label>Frost (blur) <span class="v" id="vB">2.0</span></label><input id="sB" type="range" min="0" max="6" step="0.5" value="2">
  <label>Chromatic <span class="v" id="vC">6</span></label><input id="sC" type="range" min="0" max="20" value="6">
  <label>Magnify <span class="v" id="vM">12</span></label><input id="sM" type="range" min="0" max="40" value="12">
</div>

<script>
const cv = document.getElementById('gl');
const gl = cv.getContext('webgl', { antialias:true, premultipliedAlpha:false });
if(!gl){ document.body.innerHTML = '<p style="color:#fff;padding:40px">WebGL not supported — use the CSS/SVG liquid-glass demo instead.</p>'; }

// ---- fullscreen triangle ----
const vsrc = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;

// ---- the liquid-glass fragment shader ----
const fsrc = `
precision highp float;
uniform vec2  u_res;        // canvas size (px)
uniform float u_time;
uniform vec2  u_lens;       // lens center (px)
uniform vec2  u_half;       // lens half-size (px)
uniform float u_radius;     // corner radius (px)
uniform float u_strength;   // refraction strength
uniform float u_blur;       // frost
uniform float u_chroma;     // chromatic aberration
uniform float u_mag;        // magnification

// --- the LIVE background being refracted (procedural: moving blobs + a grid) ---
vec3 background(vec2 px){
  vec2 uv = px / u_res;
  vec3 col = mix(vec3(0.05,0.05,0.16), vec3(0.10,0.07,0.22), uv.y);
  // moving colour blobs (this is the "live" content)
  vec2 b1 = vec2(0.30+0.12*sin(u_time*0.5), 0.32+0.10*cos(u_time*0.4));
  vec2 b2 = vec2(0.74+0.10*cos(u_time*0.3), 0.22+0.09*sin(u_time*0.6));
  vec2 b3 = vec2(0.55+0.11*sin(u_time*0.35),0.78+0.10*cos(u_time*0.45));
  col += vec3(0.55,0.25,0.95) * smoothstep(0.45,0.0, distance(uv,b1));
  col += vec3(0.95,0.30,0.65) * smoothstep(0.42,0.0, distance(uv,b2));
  col += vec3(0.15,0.75,0.95) * smoothstep(0.48,0.0, distance(uv,b3));
  // a grid — straight lines bending through the lens make refraction obvious
  vec2 g = abs(fract(px/46.0) - 0.5);
  float line = smoothstep(0.46,0.5, max(g.x,g.y));
  col += vec3(1.0) * line * 0.06;
  return col;
}

// signed distance to a rounded rectangle
float sdRoundRect(vec2 p, vec2 b, float r){
  vec2 q = abs(p) - b + r;
  return min(max(q.x,q.y),0.0) + length(max(q,0.0)) - r;
}

void main(){
  vec2 px = gl_FragCoord.xy;
  vec2 p  = px - u_lens;                       // local coords to lens center
  float d = sdRoundRect(p, u_half, u_radius);  // <0 inside the glass

  vec3 outside = background(px);
  if(d > 1.0){ gl_FragColor = vec4(outside,1.0); return; }   // plain background

  // surface gradient (points outward from the lens) — the "bevel normal" in 2D
  vec2 e = vec2(2.0, 0.0);
  vec2 grad = normalize(vec2(
    sdRoundRect(p+e.xy,u_half,u_radius) - sdRoundRect(p-e.xy,u_half,u_radius),
    sdRoundRect(p+e.yx,u_half,u_radius) - sdRoundRect(p-e.yx,u_half,u_radius)
  ) + 1e-5);

  float bevel = 30.0;                          // bevel width (px)
  float rim   = 1.0 - smoothstep(0.0, bevel, -d);   // 1 at the edge -> 0 inside (the curved rim)
  float inside= smoothstep(1.0, -1.0, d);           // AA mask

  // 1) REFRACTION: bend the sample outward, strongest at the rim
  vec2 refr = px + grad * rim * u_strength;
  // 2) MAGNIFY: pull the sample toward center across the whole pane
  refr = u_lens + (refr - u_lens) * (1.0 - u_mag*0.01);

  // 3) FROST: a few blurred taps
  vec3 col = vec3(0.0); float w = 0.0;
  for(int i=-2;i<=2;i++){
    float o = float(i)*u_blur;
    // 4) CHROMATIC ABERRATION: split R/G/B along the rim direction
    col.r += background(refr + grad*(u_chroma+o)).r;
    col.g += background(refr + vec2(o, -o)*0.5).g;
    col.b += background(refr - grad*(u_chroma-o)).b;
    w += 1.0;
  }
  col /= w;

  // 5) SPECULAR highlight on the bevel (light from upper-left)
  vec3 n = normalize(vec3(grad * rim, 1.0));
  vec3 L = normalize(vec3(-0.6, 0.7, 0.55));
  float spec = pow(max(dot(n,L),0.0), 18.0) * rim;
  col += vec3(1.0) * spec * 0.9;
  // a faint overall glass tint + top sheen
  col += vec3(1.0) * smoothstep(0.0,-u_half.y, p.y) * 0.04;

  // 6) bright RIM line + subtle chromatic edge
  float rimLine = smoothstep(2.0, 0.0, abs(d));
  col += mix(vec3(0.7,0.85,1.0), vec3(1.0,0.8,0.9), grad.x*0.5+0.5) * rimLine * 0.5;

  gl_FragColor = vec4(mix(outside, col, inside), 1.0);
}`;

function sh(type, src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, vsrc));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fsrc));
gl.linkProgram(prog); gl.useProgram(prog);

const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog,'p'); gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

const U = n => gl.getUniformLocation(prog,n);
const u = { res:U('u_res'), time:U('u_time'), lens:U('u_lens'), half:U('u_half'),
  radius:U('u_radius'), strength:U('u_strength'), blur:U('u_blur'), chroma:U('u_chroma'), mag:U('u_mag') };

let W,H,DPR=Math.min(devicePixelRatio||1, 2);
const lens = { x:0, y:0, hx:170, hy:110 };
function resize(){ W=cv.width=innerWidth*DPR; H=cv.height=innerHeight*DPR;
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  gl.viewport(0,0,W,H); if(lens.x===0){ lens.x=W/2; lens.y=H/2; } }
addEventListener('resize', resize); resize();

// drag the lens
let drag=false, off=[0,0];
function pos(e){ const t=e.touches?e.touches[0]:e; return [t.clientX*DPR, H - t.clientY*DPR]; }
cv.addEventListener('pointerdown', e=>{ const [x,y]=pos(e); drag=true; off=[x-lens.x, y-lens.y]; });
addEventListener('pointermove', e=>{ if(!drag) return; const [x,y]=pos(e); lens.x=x-off[0]; lens.y=y-off[1]; });
addEventListener('pointerup', ()=> drag=false);

// sliders
const ctrl={}; ['R','B','C','M'].forEach(k=>{ const s=document.getElementById('s'+k), v=document.getElementById('v'+k);
  ctrl[k]=parseFloat(s.value); s.addEventListener('input',()=>{ ctrl[k]=parseFloat(s.value); v.textContent=s.value; }); });

const t0=performance.now();
(function loop(){
  const tm=(performance.now()-t0)/1000;
  // gentle idle float when not dragging
  if(!drag){ lens.x += Math.sin(tm*0.6)*0.25*DPR; lens.y += Math.cos(tm*0.5)*0.25*DPR; }
  gl.uniform2f(u.res,W,H); gl.uniform1f(u.time,tm);
  gl.uniform2f(u.lens,lens.x,lens.y); gl.uniform2f(u.half,lens.hx*DPR,lens.hy*DPR);
  gl.uniform1f(u.radius,70*DPR);
  gl.uniform1f(u.strength,ctrl.R*DPR); gl.uniform1f(u.blur,ctrl.B*DPR);
  gl.uniform1f(u.chroma,ctrl.C*DPR); gl.uniform1f(u.mag,ctrl.M);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
